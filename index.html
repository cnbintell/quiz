<html lang="my"><head><meta charset="utf-8">

<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;color:#222;background:linear-gradient(135deg,#6a11cb,#2575fc 50%,#ff6ec4);background-size:300% 300%;animation:bg 14s ease infinite;padding:14px}
@keyframes bg{50%{background-position:100% 50%}}
.card{max-width:560px;margin:0 auto 14px;background:#fff;border-radius:22px;padding:18px;box-shadow:0 10px 36px #0004}
h1,h2,h3{margin:0 0 12px}h2{line-height:1.5}
button{font:inherit;border:0;border-radius:14px;padding:12px 16px;background:#6a5acd;color:#fff;font-weight:600;cursor:pointer;margin:4px 2px}
button.g{background:#eee;color:#333}button.r{background:#ff4d6d}button.y{background:#ffd54a;color:#333}
input,select,textarea{font:inherit;width:100%;padding:12px;margin:6px 0;border:2px solid #ddd;border-radius:12px}
.o{display:block;width:100%;text-align:left;margin:10px 0;padding:14px;background:#fff;color:#222;border:2px solid #ddd;font-weight:500}
.o.ok{background:#3ddc84;color:#fff;border-color:#3ddc84}.o.no{background:#ff4d6d;color:#fff;border-color:#ff4d6d;animation:sh .4s}

.bar{height:10px;background:#eee;border-radius:9px;overflow:hidden;margin:10px 0 16px}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#43e97b,#f9d423,#ff4b2b);transition:width 1s linear}

.b{font-size:12px;padding:3px 10px;border-radius:20px;background:#e8f5e9;color:#2e7d32}.p{background:#fff3cd;color:#8a6d00}
.it{padding:10px 0;border-bottom:1px solid #eee;font-size:14px}.m{font-size:13px;color:#666}img.q{max-width:100%;border-radius:14px}
.msg{padding:10px;border-radius:12px;margin:6px 0;white-space:pre-wrap}.me{background:#e8eaf6}.ai{background:#f1f8e9}
.hd{max-width:560px;margin:0 auto 14px;text-align:center;color:#fff;font-size:26px;font-weight:800;letter-spacing:.5px;text-shadow:0 2px 10px #0006}
.ft{max-width:560px;margin:18px auto 6px;text-align:center;color:#fffd;font-size:13px}
canvas{position:fixed;inset:0;pointer-events:none;z-index:9}.fl{animation:fl .5s}@keyframes fl{50%{background:#ff1744}}

<canvas id="cv"></canvas>
<div class="hd">🎓 intellearn Quiz</div>

<div class="ft">Copyright © intellearn</div>
<script>
const PROXY="https://quiz-proxy.cnbintell.workers.dev",DIRECT="https://fositnokxzztfwtbydro.supabase.co";let bases=[PROXY,DIRECT];
async function sbFetch(u,o={}){const path=String(u).replace(PROXY,""),ms=/\/(functions|storage)\//.test(path)?120000:15000;let err;
for(const b of [...bases]){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(b+path,{...o,signal:c.signal});if(b!=bases[0])bases=[b,...bases.filter(x=>x!=b)];return r}catch(e){err=e}finally{clearTimeout(t)}}throw err}
const sb=supabase.createClient(PROXY,"sb_publishable_5Hcqx3pkwYmhqS1-2Y-C3A_rrcInJde",{global:{fetch:sbFetch}});
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function R(f,n=5){for(let i=0;;i++){try{const r=await f();if(!r.error||i>=n-1||!/fetch|network|timeout|load failed/i.test(r.error.message))return r}catch(e){if(i>=n-1)return{error:e}}await sleep(800*2**i)}}
let U=null,P=null,CATS=[],tm;
let CFG={free_limit:10,site_title:"intellearn Quiz",site_logo:""};
function applyCfg(){$(".hd").innerHTML=(CFG.site_logo?`<img src="${esc(CFG.site_logo)}" style="height:40px;vertical-align:middle;border-radius:10px;margin-right:8px">`:"🎓 ")+esc(CFG.site_title);document.title=CFG.site_title}
async function loadCfg(){const r=await R(()=>sb.from("settings").select("*"));(r.data||[]).forEach(x=>{if(x.key=="free_limit")CFG.free_limit=+x.value||10;if(x.key=="site_title"&&x.value)CFG.site_title=x.value;if(x.key=="site_logo")CFG.site_logo=x.value});applyCfg()}
const card=h=>app.innerHTML=h;
const today=()=>new Date().toISOString().slice(0,10);
const sign=u=>u.is_premium?'<span class="b p">💎 Premium</span>':'<span class="b">🆓 Free</span>';

async function init(){applyCfg();loadCfg();const{data}=await sb.auth.getSession();if(!data.session)return authView();U=data.session.user;await loadP();home()}
async function loadP(){P=(await R(()=>sb.from("profiles").select("*").eq("id",U.id).single())).data||{}}
function authView(){card(`<div class=card><h1>🎯 Quiz Master</h1><p class=m>Login / Register</p><input id=n placeholder="နာမည် (Register အတွက်)"><input id=e type=email placeholder="Email"><input id=p type=password placeholder="Password (၆ လုံးအထက်)"><button id=l>🔐 Login</button><button class=y id=r>📝 Register</button><div id=er class=m></div></div>`);
const go=async reg=>{$("#er").textContent="⏳…";const e=$("#e").value.trim(),p=$("#p").value;const{error}=reg?await sb.auth.signUp({email:e,password:p,options:{data:{name:$("#n").value}}}):await sb.auth.signInWithPassword({email:e,password:p});if(error)$("#er").textContent="❌ "+error.message;else init()};
$("#l").onclick=()=>go(0);$("#r").onclick=()=>go(1)}

async function home(){
CATS=(await R(()=>sb.from("categories").select("*").order("id"))).data||[];
card(`<div class=card><div class=row><div><h3>👋 ${esc(P.name||P.email)}</h3>${sign(P)}</div><div>${P.is_admin?'<button class=y id=ad>🛠 Admin</button>':''}<button class=g id=lo>Logout</button></div></div></div>
<div class=card><h3>📚 Category ရွေးပါ</h3>${CATS.map(c=>`<button class=o data-c=${c.id}>📘 ${esc(c.name)} <span class=m>(${c.secs}s/ပုဒ်)</span></button>`).join("")||"<p class=m>Category မရှိသေးပါ</p>"}</div>
${P.is_premium?"":`<div class=card style="background:linear-gradient(135deg,#ffe259,#ffa751)"><h3>💎 Premium ဝင်ပါ</h3><p>✅ Category အားလုံး ✅ ဖြေလိုသလောက် (၅/၁၀/၂၀/၃၀…) ✅ နေ့စဉ် ကန့်သတ်ချက်မရှိ<br>🆓 Free က တစ်ရက် ${CFG.free_limit} ပုဒ်ပဲ ဖြေရပါတယ်</p><button id=pm>💎 Premium ဝင်မယ်</button></div>`}`);
$("#lo").onclick=async()=>{await sb.auth.signOut();authView()};if($("#ad"))$("#ad").onclick=()=>admin("gen");if($("#pm"))$("#pm").onclick=premium;
document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>pickCat(+b.dataset.c))}

async function pickCat(id){
if(P.is_premium){card(`<div class=card><h3>📝 ဘယ်နှပုဒ်ဖြေမလဲ?</h3>${[5,10,20,30].map(n=>`<button data-n=${n}>${n}</button>`).join("")}<input id=cn type=number placeholder="စိတ်ကြိုက်ဂဏန်း"><button class=y id=go>စမယ်</button><button class=g id=bk>⬅ Back</button></div>`);
document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>quiz(id,+b.dataset.n));$("#go").onclick=()=>quiz(id,+$("#cn").value||10);$("#bk").onclick=home;return}
const used=((await R(()=>sb.from("results").select("total").eq("user_id",U.id).gte("created_at",today()+"T00:00:00Z"))).data||[]).reduce((a,x)=>a+x.total,0),left=CFG.free_limit-used;
if(left<=0){card(`<div class=card><h3>⏳ ဒီနေ့အတွက် ${CFG.free_limit} ပုဒ် ဖြေပြီးပါပြီ</h3><p>မနက်ဖြန်ပြန်လာပါ။ 💎 Premium ဆိုရင် ကန့်သတ်ချက်မရှိပါ!</p><button id=pm>💎 Premium ဝင်မယ်</button><button class=g id=bk>⬅ Back</button></div>`);$("#pm").onclick=premium;$("#bk").onclick=home;return}
quiz(id,left)}

let Q=[],qi=0,sc=0,left=0,secs=30,t0=0,lock=false,cat=null;
async function quiz(id,n){cat=CATS.find(c=>c.id==id);secs=cat.secs;
const r=await R(()=>sb.from("questions").select("*").eq("cat_id",id));const a=(r.data||[]).sort(()=>Math.random()-.5).slice(0,n);
if(!a.length){card(`<div class=card>မေးခွန်းမရှိသေးပါ <button id=bk>⬅</button></div>`);$("#bk").onclick=home;return}
Q=a;qi=0;sc=0;t0=Date.now();ask()}
function ask(){if(qi>=Q.length)return fin();lock=false;left=secs;const q=Q[qi];
card(`<div class=card><div class=row><b>❓ ${qi+1}/${Q.length}</b><b>⏱ <span id=t>${left}</span>s</b></div><div class=bar><i id=bar></i></div><h2>${esc(q.q)}</h2>${q.options.map((x,k)=>`<button class=o data-k=${k}>${"ABCD"[k]}. ${esc(x)}</button>`).join("")}<div id=ex class=m></div></div>`);
document.querySelectorAll(".o").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
clearInterval(tm);tm=setInterval(()=>{left--;$("#t").textContent=left;$("#bar").style.width=left/secs*100+"%";if(left<=0)pick(-1)},1000)}
function pick(k){if(lock)return;lock=true;clearInterval(tm);const q=Q[qi],ok=k==q.answer,bs=document.querySelectorAll(".o");
bs[q.answer].classList.add("ok");if(k>=0&&!ok)bs[k].classList.add("no");
if(ok){sc++;boom()}else{document.body.classList.add("fl");setTimeout(()=>document.body.classList.remove("fl"),500)}
$("#ex").innerHTML=(ok?"🎉 မှန်ပါတယ်!":k<0?"⌛ အချိန်ကုန်ပြီ":"💥 မှားပါတယ်")+"<br>💡 "+esc(q.explanation||"");
setTimeout(()=>{qi++;ask()},ok?1300:2500)}
async function fin(){const s=Math.round((Date.now()-t0)/1000),pc=Math.round(sc*100/Q.length);
card(`<div class=card style="text-align:center"><div style="font-size:56px">${pc>=70?"🏆":pc>=40?"👍":"💪"}</div><h2>ရလဒ်: ${sc}/${Q.length} (${pc}%)<br>⏱ ${Math.floor(s/60)}မိ ${s%60}စက္ကန့်</h2><div id=st class=m>📤 Admin ထံပို့နေသည်…</div>${P.is_premium?"":'<button class=y id=pm>💎 Premium ဝင်ပြီး ဆက်ဖြေမယ်</button>'}<button id=bk>🏠 Home</button></div>`);
$("#bk").onclick=home;if($("#pm"))$("#pm").onclick=premium;if(pc>=70)boom(3);
const r=await R(()=>sb.from("results").insert({user_id:U.id,cat_id:cat.id,score:sc,total:Q.length,secs:s}));$("#st").textContent=r.error?"⚠️ သိမ်းမရပါ":"✅ Admin ထံ ပို့ပြီး"}

async function premium(){
const s=Object.fromEntries(((await R(()=>sb.from("settings").select("*"))).data||[]).map(x=>[x.key,x.value]));
card(`<div class=card><h3>💎 Premium ဝင်ရန်</h3>${s.kpay_img?`<img class=q src="${esc(s.kpay_img)}">`:""}<p>${esc(s.kpay_note||"KPay ဖြင့် ငွေလွှဲပါ")}</p><p>📸 ငွေလွှဲပြီး ပြေစာ screenshot ကို ပို့ပါ — ချက်ချင်း Premium ဖြစ်ပါမယ်!</p><input id=f type=file accept="image/*"><button id=up>📤 ပြေစာပို့မယ်</button><button class=g id=bk>⬅ Back</button><div id=er class=m></div></div>`);
$("#bk").onclick=home;$("#up").onclick=async()=>{const f=$("#f").files[0];if(!f)return $("#er").textContent="ပုံရွေးပါ";$("#er").textContent="⏳…";
const path=U.id+"/"+Date.now()+".jpg";const u=await R(()=>sb.storage.from("receipts").upload(path,f));if(u.error)return $("#er").textContent="❌ "+u.error.message;
const url=sb.storage.from("receipts").getPublicUrl(path).data.publicUrl;const c=await R(()=>sb.rpc("claim_premium",{url}));
if(c.error)return $("#er").textContent="❌ "+c.error.message;await loadP();alert("🎉 Premium ဖြစ်ပါပြီ! Admin က စစ်ဆေးပါမည်။");home()}}

// ---------------- Admin ----------------
async function readFile(f){if(!f)return{};const n=f.name.toLowerCase();
const b64=b=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(",")[1]);x.readAsDataURL(b)});
if(f.type.startsWith("image/")){try{const bm=await createImageBitmap(f),k=Math.min(1,1600/Math.max(bm.width,bm.height)),c2=document.createElement("canvas");c2.width=Math.round(bm.width*k);c2.height=Math.round(bm.height*k);c2.getContext("2d").drawImage(bm,0,0,c2.width,c2.height);return{image:{mime:"image/jpeg",data:c2.toDataURL("image/jpeg",.85).split(",")[1]}}}catch(e){return{image:{mime:f.type,data:await b64(f)}}}}
if(n.endsWith(".pdf")||/^(audio|video)\//.test(f.type)){const mime=n.endsWith(".pdf")?"application/pdf":f.type;const p=U.id+"/"+Date.now()+"_"+(n.replace(/[^a-z0-9.]/g,"")||"f");
const u=await R(()=>sb.storage.from("uploads").upload(p,f,{contentType:mime}));if(u.error)throw u.error;return{path:p,mime}}
if(/\.(xlsx|xls|csv)$/.test(n)){const wb=XLSX.read(await f.arrayBuffer());return{text:wb.SheetNames.map(s=>XLSX.utils.sheet_to_csv(wb.Sheets[s])).join("\n")}}
if(n.endsWith(".docx"))return{text:(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value};
if(n.endsWith(".pptx")){const z=await JSZip.loadAsync(await f.arrayBuffer());let t="";for(const k of Object.keys(z.files).filter(k=>/ppt\/slides\/slide\d+\.xml$/.test(k)))t+=[...(await z.files[k].async("string")).matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m=>m[1]).join(" ")+"\n";return{text:t}}
return{text:await f.text()}}
async function callAI(body){let m="";for(let i=0;i<2;i++){const{data,error}=await sb.functions.invoke("ai",{body});if(!error&&data&&!data.error)return data;m=error?.message||data?.error||"";try{m=(await error.context.json()).error||m}catch{}if(/Admin|Login|Gemini:/.test(m))return{error:m};await sleep(1500)}return{error:m||"လိုင်းကျပ်နေသည်၊ ပြန်စမ်းပါ"}}
const TABS={gen:"🤖 Quiz",qs:"❓ မေးခွန်း",chat:"💬 AI Chat",cat:"📁 Category",users:"👥 Users",res:"📊 ရလဒ်",pay:"💳 KPay/ပြေစာ",set:"⚙️ Settings"};
async function admin(t){card(`<div class=card><div class=row><h3>🛠 Admin Panel</h3><button class=g id=hm>🏠</button></div><div class=tabs>${Object.entries(TABS).map(([k,v])=>`<button class="${k==t?"":"g"}" data-t=${k}>${v}</button>`).join("")}</div></div><div class=card id=body>⏳</div>`);
$("#hm").onclick=home;document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>admin(b.dataset.t));
CATS=(await R(()=>sb.from("categories").select("*").order("id"))).data||[];const B=$("#body"),opts=CATS.map(c=>`<option value=${c.id}>${esc(c.name)}</option>`).join("");
if(t=="gen"){B.innerHTML=`<select id=c>${opts}</select><input id=n type=number value=10 placeholder="ပုဒ်ရေ"><textarea id=tx rows=5 placeholder="Text ရိုက်/paste လုပ်ပါ (သို့) ဖိုင်ရွေးပါ"></textarea><input id=f type=file accept="image/*,.pdf,.txt,.docx,.pptx,.xlsx,.xls,.csv"><button id=g>🤖 Quiz ထုတ်မယ်</button><div id=st class=m></div>`;
$("#g").onclick=async()=>{if(!$("#c").value)return $("#st").textContent="Category အရင်ဆောက်ပါ";$("#st").textContent="⏳ ထုတ်နေသည်… (ခဏစောင့်ပါ)";
try{const fr=await readFile($("#f").files[0]);const r=await callAI({mode:"quiz",count:+$("#n").value||10,text:$("#tx").value+"\n"+(fr.text||""),image:fr.image,path:fr.path,mime:fr.mime});if(r.error)return $("#st").textContent="❌ "+r.error;
const rows=r.questions.map(x=>({cat_id:+$("#c").value,q:x.q,options:x.o,answer:+x.a,explanation:x.e||""}));const i=await R(()=>sb.from("questions").insert(rows));$("#st").textContent=i.error?"❌ "+i.error.message:"✅ မေးခွန်း "+rows.length+" ပုဒ် ထည့်ပြီး"}catch(e){$("#st").textContent="❌ "+e.message}}}
if(t=="chat"){B.innerHTML=`<div id=log></div><textarea id=m rows=2 placeholder="မေးပါ…"></textarea><button id=s>➤ ပို့မယ်</button>`;$("#s").onclick=async()=>{const m=$("#m").value.trim();if(!m)return;$("#m").value="";$("#log").innerHTML+=`<div class="msg me">${esc(m)}</div>`;const r=await callAI({mode:"chat",text:m});$("#log").innerHTML+=`<div class="msg ai">${esc(r.text||"❌ "+r.error)}</div>`}}
if(t=="qs"){B.innerHTML=`<select id=qc>${opts}</select><div id=ql></div>`;
const form=(x,id)=>`<div class=it data-id="${id}"><textarea rows=2 data-f=q placeholder="မေးခွန်း">${esc(x.q||"")}</textarea>${[0,1,2,3].map(k=>`<input data-f=o${k} placeholder="${"ABCD"[k]}" value="${esc((x.options||[])[k]||"")}">`).join("")}<select data-f=a>${[0,1,2,3].map(k=>`<option value=${k} ${x.answer==k?"selected":""}>အဖြေမှန်: ${"ABCD"[k]}</option>`).join("")}</select><input data-f=e placeholder="ရှင်းလင်းချက်" value="${esc(x.explanation||"")}"><button data-sv>💾 သိမ်း</button>${id=="new"?"":'<button class=r data-del>🗑</button>'}</div>`;
const load=async()=>{const cid=+$("#qc").value;if(!cid){$("#ql").textContent="Category အရင်ဆောက်ပါ";return}
const rs=(await R(()=>sb.from("questions").select("*").eq("cat_id",cid).order("id",{ascending:false}).limit(200))).data||[];
$("#ql").innerHTML=`<h3>➕ အသစ်ထည့်ရန်</h3>${form({},"new")}<p class=m>${rs.length} ပုဒ်</p>`+rs.map(x=>form(x,x.id)).join("");
document.querySelectorAll("[data-sv]").forEach(b=>b.onclick=async()=>{const w=b.closest(".it"),g=f=>w.querySelector(`[data-f=${f}]`).value.trim(),id=w.dataset.id;
const row={cat_id:cid,q:g("q"),options:[0,1,2,3].map(k=>g("o"+k)),answer:+g("a"),explanation:g("e")};
if(!row.q||row.options.some(o=>!o))return alert("မေးခွန်းနဲ့ ရွေးချယ်စရာ ၄ ခုလုံး ဖြည့်ပါ");
const r=await R(()=>id=="new"?sb.from("questions").insert(row):sb.from("questions").update(row).eq("id",id));if(r.error)return alert(r.error.message);if(id=="new")load();else b.textContent="✅"});
document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("ဖျက်မလား?")){await R(()=>sb.from("questions").delete().eq("id",b.closest(".it").dataset.id));load()}})};
$("#qc").onchange=load;load()}
if(t=="set"){B.innerHTML=`<label class=m>ခေါင်းစဉ်</label><input id=ti value="${esc(CFG.site_title)}"><label class=m>Free user နေ့စဉ် ဖြေခွင့် (ပုဒ်ရေ)</label><input id=fl type=number min=1 value=${CFG.free_limit}><label class=m>Logo (ပုံ)</label>${CFG.site_logo?`<img class=q style="max-height:80px" src="${esc(CFG.site_logo)}"><br><button class=g id=rl>🗑 Logo ဖယ်မယ်</button>`:""}<input id=lf type=file accept="image/*"><button id=sv>💾 သိမ်းမယ်</button><div id=st class=m></div>`;

// confetti
const cv=$("#cv"),cx=cv.getContext("2d");let ps=[];const rz=()=>{cv.width=innerWidth;cv.height=innerHeight};rz();onresize=rz;
function boom(n=1){const was=ps.length;for(let j=0;j<80*n;j++)ps.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-2,r:Math.random()*5+2,c:`hsl(${Math.random()*360},90%,60%)`,l:90});if(!was)lp()}
function lp(){cx.clearRect(0,0,cv.width,cv.height);ps=ps.filter(p=>p.l-->0);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;cx.fillStyle=p.c;cx.globalAlpha=p.l/90;cx.fillRect(p.x,p.y,p.r,p.r)});if(ps.length)requestAnimationFrame(lp);else cx.clearRect(0,0,cv.width,cv.height)}
init();
</script></body></html>
